version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:4000
    depends_on:
      - backend
    restart: unless-stopped
